[project]
name = "koreader-notebooklm-bridge"
version = "0.1.0"
description = "Local bridge scaffold for KOReader NotebookLM integration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30.0",
  "websocket-client>=1.8.0",
]

[project.optional-dependencies]
dev = [
  "lupa>=2.8",
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
